name: Build and deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the website image after building
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: blog-website
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Set semantic image tag
        id: image
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (typeof version !== 'string' || version.trim() !== version || !/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(version)) {
            throw new Error('package.json version must be X.Y.Z');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `image=devin-my-blog:v${version}\n`);
          NODE
      - run: npm ci
      - run: npm run format:check && npm run lint
      - run: npm run build
      - name: Package website image
        env:
          BLOG_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          mkdir -p deployment
          docker build --tag "$BLOG_IMAGE" --label "org.opencontainers.image.revision=$GITHUB_SHA" .
          docker save "$BLOG_IMAGE" | gzip > deployment/image.tar.gz
          cp compose.yaml deployment/compose.yaml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blog-website-image
          path: deployment/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blog-website-image
          path: deployment
      - name: Deploy with Docker Compose
        shell: bash
        env:
          BLOG_IMAGE: ${{ needs.build.outputs.image }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash .github/scripts/deploy.sh
