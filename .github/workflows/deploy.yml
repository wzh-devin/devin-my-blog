name: Build and deploy blog

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish to the server after building
        type: boolean
        default: false
      content_sha:
        description: Optional content commit SHA (otherwise CONTENT_BRANCH)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: blog-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONTENT_REPOSITORY: ${{ vars.CONTENT_REPOSITORY }}
      CONTENT_BRANCH: ${{ vars.CONTENT_BRANCH }}
      CONTENT_SHA: ${{ inputs.content_sha }}
      BLOG_CONTENT_DIR: ./content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate content settings
        shell: bash
        run: |
          set -euo pipefail
          : "${CONTENT_REPOSITORY:?Set the CONTENT_REPOSITORY repository variable}"
          : "${CONTENT_BRANCH:?Set the CONTENT_BRANCH repository variable}"
          [[ "$CONTENT_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo 'Invalid CONTENT_REPOSITORY' >&2; exit 1; }
          git check-ref-format --branch "$CONTENT_BRANCH" >/dev/null
          if [[ -n "$CONTENT_SHA" && ! "$CONTENT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'content_sha must be a 40-character commit SHA' >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      # 内容仓库独立维护排版，先检查网站代码，再拉取内容。
      - run: npm run format:check && npm run lint
      - name: Checkout content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CONTENT_REPOSITORY }}
          ref: ${{ env.CONTENT_SHA || env.CONTENT_BRANCH }}
          token: ${{ secrets.CONTENT_READ_TOKEN || github.token }}
          path: content
          persist-credentials: false
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blog-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  deploy:
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blog-dist
          path: dist
      - name: Publish static files
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash .github/scripts/deploy.sh
