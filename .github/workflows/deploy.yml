name: Build and deploy website

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the website image after building
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: blog-website
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Validate release tag
        id: image
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const tag = process.env.GITHUB_REF_NAME;
          if (process.env.GITHUB_REF_TYPE !== 'tag' || typeof tag !== 'string' || tag.trim() !== tag || !/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(tag)) {
            throw new Error('Push or select a release tag in vX.Y.Z format');
          }
          const repository = process.env.GITHUB_REPOSITORY.toLowerCase();
          appendFileSync(process.env.GITHUB_OUTPUT, `image=devin-my-blog:${tag}\nregistry_image=ghcr.io/${repository}:${tag}\n`);
          NODE
      - run: npm ci
      - run: npm run format:check && npm run lint
      - run: npm run build
      - name: Package website image
        env:
          BLOG_IMAGE: ${{ steps.image.outputs.image }}
          REGISTRY_IMAGE: ${{ steps.image.outputs.registry_image }}
        run: |
          set -euo pipefail
          mkdir -p deployment
          docker build --tag "$BLOG_IMAGE" --tag "$REGISTRY_IMAGE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$GITHUB_REF_NAME" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
          docker save "$BLOG_IMAGE" | gzip > deployment/image.tar.gz
          cp compose.yaml deployment/compose.yaml
      - name: Publish image to GitHub Packages
        if: github.event_name != 'workflow_dispatch' || inputs.deploy
        env:
          REGISTRY_IMAGE: ${{ steps.image.outputs.registry_image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$REGISTRY_IMAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blog-website-image
          path: deployment/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blog-website-image
          path: deployment
      - name: Deploy with Docker Compose
        shell: bash
        env:
          BLOG_IMAGE: ${{ needs.build.outputs.image }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash .github/scripts/deploy.sh
