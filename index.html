<!doctype html>
<html lang="zh-CN" data-theme="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffdfa" />
    <meta
      name="description"
      content="一个关于开发、设计与日常思考的个人博客。构建，思考，然后写下来。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Devin, my blog.</title>
    <script>
      try {
        let saved;
        try {
          saved = localStorage.getItem('blog-theme');
        } catch {}
        const theme = saved === 'morning' ? 'sunrise' : saved;
        const selected = ['dawn', 'sunrise', 'day', 'sunset', 'dusk', 'night'].includes(theme)
          ? theme
          : matchMedia('(prefers-color-scheme: dark)').matches
            ? 'night'
            : 'day';
        document.documentElement.dataset.theme = selected;
        document.documentElement.classList.toggle(
          'dark',
          ['dawn', 'dusk', 'night'].includes(selected),
        );
      } catch {}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>
    <div id="ambient-root"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
